name: Main

# Runs CI and the security suite on every push to main, including pushes
# that only touch workflows, docs or Guild knowledge. Whether a push cuts a
# release is decided inside the release-tag job (scripts/release-version.sh),
# not by a trigger path filter, so workflow-only edits are still
# validated but do not produce a release.
on:
  push:
    branches: [main]

# Cancelling an older run is safe: the release-tag job only computes a
# version and dispatches release.yml, which creates the tag itself. A
# cancelled run therefore never leaves a pushed tag without a release.
concurrency:
  group: "main-pipeline"
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.27.3"
  GOTOOLCHAIN: local

jobs:
  ci:
    name: CI Checks
    permissions:
      contents: read
    uses: ./.github/workflows/_ci-checks.yml

  security:
    name: Security Checks
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/_security-checks.yml
    secrets:
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  sonarcloud:
    name: SonarCloud Analysis
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  generate-reports:
    name: Generate Reports
    needs: [ci, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: always()
    steps:
      - uses: actions/checkout@v7

      - name: Download coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage
        continue-on-error: true

      - name: Generate CODE-QUALITY.md
        env:
          VET_STATUS: ${{ needs.ci.outputs.vet_status }}
          BUILD_STATUS: ${{ needs.ci.outputs.build_status }}
          TIDY_STATUS: ${{ needs.ci.outputs.tidy_status }}
          PROVIDERS_DOC_STATUS: ${{ needs.ci.outputs.providers_doc_status }}
          LINT_STATUS: ${{ needs.ci.outputs.lint_status }}
          LINT_ISSUES: ${{ needs.ci.outputs.lint_issues_count }}
          TEST_STATUS: ${{ needs.ci.outputs.test_status }}
          TEST_COUNT: ${{ needs.ci.outputs.test_count }}
          COVERAGE: ${{ needs.ci.outputs.coverage_pct }}
          INT_STATUS: ${{ needs.ci.outputs.integration_status }}
          INT_COUNT: ${{ needs.ci.outputs.integration_count }}
        run: |
          cat > CODE-QUALITY.md << 'HEADER'
          # Code Quality Report

          > Auto-generated by CI pipeline. Do not edit manually.

          HEADER

          {
            TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
            echo "**Last updated:** ${TIMESTAMP}"
            echo ""

            # Linting section
            echo "## Linting"
            echo ""
            if [ "$LINT_STATUS" = "passing" ]; then
              echo "**Status:** Passing"
            else
              echo "**Status:** Failing"
            fi
            echo "**Issues found:** ${LINT_ISSUES:-0}"
            echo ""
            echo "**Linters enabled:** gosec, govet, staticcheck, errcheck, ineffassign, unused, gofmt, goimports, misspell, revive, bodyclose, noctx, gocritic"
            echo ""

            # Unit tests section
            echo "## Unit Tests"
            echo ""
            if [ "$TEST_STATUS" = "passing" ]; then
              echo "**Status:** Passing"
            else
              echo "**Status:** Failing"
            fi
            echo "**Total tests:** ${TEST_COUNT:-0}"
            echo "**Coverage:** ${COVERAGE:-0}%"
            echo ""

            # Integration tests section
            echo "## Integration Tests"
            echo ""
            if [ "$INT_STATUS" = "passing" ]; then
              echo "**Status:** Passing"
            else
              echo "**Status:** Failing"
            fi
            echo "**Total tests:** ${INT_COUNT:-0}"
            echo ""

            # Build checks section
            echo "## Build Checks"
            echo ""
            echo "| Check | Status |"
            echo "|-------|--------|"
            row() { case "$2" in passing|clean) echo "| $1 | ${3} |" ;; "") echo "| $1 | Not run |" ;; *) echo "| $1 | ${4} |" ;; esac; }
            {
              row "go vet" "$VET_STATUS" Passing Failing
              row "go build" "$BUILD_STATUS" Passing Failing
              row "go mod tidy" "$TIDY_STATUS" Clean Drift
              row "provider catalog (docs/reference/providers.md)" "$PROVIDERS_DOC_STATUS" "Up to date" Stale
            }
            echo ""

            # SonarCloud link
            echo "## SonarCloud"
            echo ""
            echo "Full analysis available at [SonarCloud Dashboard](https://sonarcloud.io/project/overview?id=lookatitude_beluga-ai)"
          } >> CODE-QUALITY.md

      - name: Generate SECURITY.md
        env:
          TRIVY_STATUS: ${{ needs.security.outputs.trivy_status }}
          TRIVY_FINDINGS: ${{ needs.security.outputs.trivy_findings }}
          GOVULNCHECK_STATUS: ${{ needs.security.outputs.govulncheck_status }}
          GOVULNCHECK_VULNS: ${{ needs.security.outputs.govulncheck_vulns }}
          GOSEC_STATUS: ${{ needs.security.outputs.gosec_status }}
          GITLEAKS_STATUS: ${{ needs.security.outputs.gitleaks_status }}
          LIC_STATUS: ${{ needs.security.outputs.licenses_status }}
          LIC_VIOLATIONS: ${{ needs.security.outputs.licenses_violations }}
        run: |
          cat > SECURITY.md << 'HEADER'
          # Security Report

          > Auto-generated by CI security pipeline. Do not edit manually.

          HEADER

          {
            TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
            echo "**Last updated:** ${TIMESTAMP}"
            echo ""

            # Snyk section
            echo "## Dependency Vulnerabilities (Snyk)"
            echo ""
            echo "Snyk runs through the Snyk GitHub App, which posts the \`security/snyk\` and \`license/snyk\` checks on every pull request."
            echo ""

            # Trivy section
            echo "## Dependency & Filesystem Scan (Trivy)"
            echo ""
            if [ "$TRIVY_STATUS" = "clean" ]; then
              echo "**Status:** No findings (CRITICAL/HIGH)"
            else
              echo "**Status:** ${TRIVY_FINDINGS:-0} findings detected"
            fi
            echo ""
            echo "Results uploaded to [GitHub Security tab](../../security/code-scanning)"
            echo ""

            # govulncheck section
            echo "## Go Vulnerability Database (govulncheck)"
            echo ""
            if [ "$GOVULNCHECK_STATUS" = "clean" ]; then
              echo "**Status:** No vulnerabilities found"
            else
              echo "**Status:** ${GOVULNCHECK_VULNS:-unknown} vulnerabilities found"
            fi
            echo ""
            echo "Scanned using the Go team's official vulnerability scanner with symbol-level reachability analysis."
            echo ""
            echo "[Go Vulnerability Database](https://vuln.go.dev)"
            echo ""

            # gosec section
            echo "## Static Security Analysis (gosec)"
            echo ""
            if [ "$GOSEC_STATUS" = "clean" ]; then
              echo "**Status:** No findings"
            else
              echo "**Status:** Findings detected — review required"
            fi
            echo ""
            echo "SARIF results uploaded to [GitHub Security tab](../../security/code-scanning)"
            echo ""

            # Gitleaks section
            echo "## Secret Detection (Gitleaks)"
            echo ""
            if [ "$GITLEAKS_STATUS" = "clean" ]; then
              echo "**Status:** No secrets detected"
            else
              echo "**Status:** Potential secrets detected — review required"
            fi
            echo ""

            # License compliance section
            echo "## License Compliance (go-licenses)"
            echo ""
            if [ "$LIC_STATUS" = "compliant" ]; then
              echo "**Status:** All dependencies compliant"
            else
              echo "**Status:** ${LIC_VIOLATIONS:-0} license violations found"
            fi
            echo ""
            echo "**Allowed licenses:** MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, MPL-2.0"
            echo ""

            # CodeQL note
            echo "## Static Analysis (CodeQL)"
            echo ""
            echo "CodeQL runs in a [separate workflow](../../actions/workflows/codeql.yml). Results are available in the [GitHub Security tab](../../security/code-scanning)."
            echo ""

            # Summary
            echo "---"
            echo ""
            echo "## Reporting Vulnerabilities"
            echo ""
            echo "If you discover a security vulnerability, please report it responsibly by emailing security@lookatitude.com. Do not open public issues for security vulnerabilities."
          } >> SECURITY.md

      - name: Upload reports artifact
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            CODE-QUALITY.md
            SECURITY.md

      - name: Write reports to the job summary
        run: |
          {
            cat CODE-QUALITY.md
            echo ""
            cat SECURITY.md
          } >> "$GITHUB_STEP_SUMMARY"

  # Generated reports are no longer committed back to main (the PRs that did
  # it were opened with GITHUB_TOKEN, so no checks ran on them and they piled
  # up unmerged). They are published instead: the job summary above, the
  # `reports` artifact, and — for releases — inside docs-bundle.tar.gz, which
  # release.yml builds from this run's `reports` artifact.

  # After main passes CI and security, compute the next version from
  # conventional commits since the last tag: minor for feat, patch otherwise.
  # Breaking changes (feat!:, fix!:, BREAKING CHANGE) skip auto-release;
  # major versions must be published manually via the Release workflow.
  #
  # This job does not push the tag. It dispatches release.yml with the tag
  # and the tested commit SHA, and release.yml's create-tag job creates an
  # annotated tag at that SHA. That removes the window where a cancelled run
  # could push a tag and never dispatch its release. (Tags pushed with
  # GITHUB_TOKEN would not trigger release.yml's push:tags event anyway.)
  release-tag:
    name: Bump Version and Create Release Tag
    needs: [ci, security, generate-reports]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # scripts/release-version.sh holds the rules (tested by
      # scripts/release-version_test.sh): skip when HEAD is tagged, when only
      # workflows/docs/Guild/Markdown changed since the last tag, on breaking
      # changes, or when there is no feat/fix/perf/revert/(deps) commit;
      # otherwise minor for feat, patch for the rest.
      - name: Decide whether to release and compute the next version
        id: bump
        run: scripts/release-version.sh

      - name: Trigger release workflow
        if: steps.bump.outputs.skip != 'true'
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ steps.bump.outputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
          REPORTS_RUN_ID: ${{ github.run_id }}
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'release.yml',
              ref: 'main',
              inputs: {
                tag: process.env.RELEASE_TAG,
                // Tag the commit this run tested, not whatever main is now.
                ref: process.env.RELEASE_SHA,
                reports_run_id: process.env.REPORTS_RUN_ID
              }
            });
