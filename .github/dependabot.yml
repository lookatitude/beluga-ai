version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels: ["dependencies", "go"]
    ignore:
      # pgx v5.11.0+ adds Rows.TypeMap(), which pgxmock v4.9.0 (the latest
      # stable release) does not implement, so the pgx-backed test doubles
      # stop compiling. Remove this once a stable pgxmock supports it.
      - dependency-name: "github.com/jackc/pgx/v5"
        versions: [">= 5.11.0"]
    groups:
      aws-sdk:
        patterns: ["github.com/aws/*"]
        update-types: ["minor", "patch"]
      otel:
        patterns: ["go.opentelemetry.io/*"]
        update-types: ["minor", "patch"]
      google:
        patterns: ["cloud.google.com/*", "google.golang.org/*"]
        update-types: ["minor", "patch"]
      go-minor-patch:
        update-types: ["minor", "patch"]
        exclude-patterns:
          - "github.com/aws/*"
          - "go.opentelemetry.io/*"
          - "cloud.google.com/*"
          - "google.golang.org/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]
