version: "2"
run:
  build-tags:
    - cgo
    - integration
linters:
  enable:
    - bodyclose
    - gocritic
    - gosec
    - misspell
    - noctx
    - revive
  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        # Public APIs take Config/Options/value types by value on purpose
        # (immutability, zero-value usability). Switching them to pointers
        # would be a breaking API change for a negligible copy cost.
        - hugeParam
    gosec:
      excludes:
        - G104 # Unhandled errors (errcheck covers this)
        - G304 # File path from variable (common in loaders)
    revive:
      rules:
        - name: exported
          arguments:
            - checkPrivateReceivers
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - gocritic
          - gosec
        path: _test\.go
      - linters:
          - errcheck
          - gosec
        path: internal/testutil/
      - linters:
          - dupl
        path: providers/
        text: similar
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
