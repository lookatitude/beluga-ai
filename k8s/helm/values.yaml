# Default values for beluga-operator.
# These values may be overridden by passing --set or -f <values-file> to helm install.
#
# PREVIEW CHART. The operator container image (ghcr.io/lookatitude/beluga-operator)
# is NOT built or published by the Beluga repository yet, and the repository has
# no operator main/binary: k8s/operator provides the reconcile logic and
# operator.NewHealthHandler (the /healthz and /readyz handlers probed below) as
# a library. With the defaults, `helm install` only installs the CRDs from
# crds/. Enable the operator only with an image you built yourself.

operator:
  # enabled renders the operator Deployment, Service, ServiceAccount and RBAC.
  # Defaults to false because no official operator image is published yet.
  enabled: false
  # watchNamespace, when set, replaces the cluster-wide ClusterRole/
  # ClusterRoleBinding with a namespaced Role/RoleBinding in that namespace.
  # The chart only scopes RBAC; your operator binary must be configured to
  # watch the same namespace.
  watchNamespace: ""

rbac:
  # create controls whether RBAC resources are rendered (requires
  # operator.enabled=true). The operator gets no access to Secrets.
  create: true

# replicaCount is the desired number of operator pod replicas.
replicaCount: 1

image:
  # repository is the container image repository.
  repository: ghcr.io/lookatitude/beluga-operator
  # pullPolicy controls when the kubelet pulls the image.
  # Options: Always, IfNotPresent, Never.
  pullPolicy: IfNotPresent
  # tag overrides the image tag. Defaults to the chart appVersion.
  tag: ""

# imagePullSecrets is a list of secret names used to pull private images.
imagePullSecrets: []

# nameOverride replaces the chart name portion of the generated resource names.
nameOverride: ""

# fullnameOverride replaces the full resource name prefix entirely.
fullnameOverride: ""

serviceAccount:
  # create controls whether a ServiceAccount is created for the operator.
  create: true
  # annotations to add to the ServiceAccount.
  annotations: {}
  # name is the ServiceAccount name to use. If empty and create=true, a name
  # is generated using the fullname helper.
  name: ""

# podAnnotations are added to each operator pod.
podAnnotations: {}

# podLabels are added to each operator pod in addition to the selector labels.
podLabels: {}

# podSecurityContext sets the pod-level security context.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# securityContext sets the container-level security context.
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
    # The root filesystem is read-only; ephemeral storage covers container
    # logs and the mounted webhook-cert secret only.
    ephemeral-storage: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

service:
  # type is the Kubernetes Service type.
  type: ClusterIP
  # port is the Service port exposed externally.
  port: 8080
  # targetPort is the container port the Service forwards to. The liveness
  # (/healthz) and readiness (/readyz) probes hit this port; the operator
  # binary must serve operator.NewHealthHandler on it.
  targetPort: 8080

# nodeSelector constrains operator pods to nodes matching these labels.
nodeSelector: {}

# tolerations allow the operator pods to be scheduled on tainted nodes.
tolerations: []

# affinity rules for operator pod scheduling.
affinity: {}

# leaderElection grants the RBAC needed for Lease-based leader election
# (a namespaced Role on coordination.k8s.io/leases). It does not configure the
# operator process itself: no environment variables are passed, so your
# operator binary must enable leader election through its own flags.
leaderElection:
  enabled: true
  # namespace is the namespace holding the Lease. Defaults to the release
  # namespace.
  namespace: ""

# metrics configures Prometheus metrics exposure.
metrics:
  enabled: false
  port: 8081

# webhook exposes an admission-webhook port and mounts its serving cert.
# The chart does NOT create the TLS secret or any
# Validating/MutatingWebhookConfiguration, and k8s/webhooks is a library
# (no server). Enabling requires certSecretName to name an existing
# kubernetes.io/tls secret (for example one issued by cert-manager).
webhook:
  enabled: false
  port: 9443
  # certDir is where the secret is mounted inside the container.
  certDir: /tmp/k8s-webhook-server/serving-certs
  # certSecretName is required when enabled=true.
  certSecretName: ""
